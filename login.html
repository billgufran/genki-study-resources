<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Genki Study Resources</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="resources/images/genkico.ico">
    <link rel="stylesheet" href="resources/css/stylesheet.min.css">
    <style>
      #magic-link-status[data-error="true"] { color: #d93025; }
      #magic-link-status[data-error="false"] { color: #1a73e8; }
    </style>
    <script src="resources/javascript/head.min.js"></script>
  </head>
  <body class="login-page">
    <main style="max-width: 32rem; margin: 4rem auto; padding: 2rem; background: rgba(255, 255, 255, 0.9); border-radius: 1rem; box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);">
      <h1 style="margin-top: 0;">Sign in</h1>
      <p>Enter your email address and we will send you a one-time login link.</p>
      <form id="magic-link-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <label for="magic-link-email" style="font-weight: bold;">Email</label>
        <input id="magic-link-email" type="email" required placeholder="you@example.com" style="padding: 0.75rem; font-size: 1rem;">
        <button type="submit" class="button" style="align-self: flex-start;">Send magic link</button>
      </form>
      <p id="magic-link-status" data-error="false" style="margin-top: 1.5rem;"></p>
    </main>
    <script type="module" src="resources/javascript/modules/login.js"></script>
  </body>
</html>
